<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Shield Base -->
  <path d="M 50,5 L 88,22 C 88,60 70,88 50,96 C 30,88 12,60 12,22 Z" fill="#090d16" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Inner Shield Accent Line -->
  <path d="M 50,14 L 80,28 C 80,58 65,80 50,87 C 35,80 20,58 20,28 Z" fill="none" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Central 'S' Letter -->
  <text x="50" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1">S</text>
</svg>